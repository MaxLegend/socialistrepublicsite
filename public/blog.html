<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Блог — Socialist Republic</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .post-form {
      background: rgba(249, 233, 200, 0.9);
      border: 2px solid var(--red);
      padding: 20px;
      margin: 30px 0;
      display: none;
    }
    .post-form h2 {
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: var(--red-dark);
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      background: white;
      font-family: inherit;
      font-size: 1rem;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    .btn-blog {
      background: var(--red);
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 10px;
    }
    .btn-blog:hover {
      background: var(--red-dark);
    }
    .post {
      margin-bottom: 40px;
      border-bottom: 1px dashed var(--red);
      padding-bottom: 20px;
    }
    .post-meta {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .admin-controls {
      margin-top: 15px;
      display: none;
    }
    .message {
      padding: 5px;
      margin: 5px 0;
      border-radius: 4px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .create-post-btn {
      margin-bottom: 30px;
      text-align: center;
    }
    
    /* Стили для комментариев */
       .comments-section {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--border);
    }
    
    .comments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    
    .comments-count {
      font-size: 1.0rem;
      color: var(--red-dark);
      font-weight: bold;
    }
    
    /* Форма комментариев - переделана в однострочную */
    .comment-form {
      background: rgba(201, 169, 122, 0.1);
      padding: 15px;
      border: 1px solid var(--border);
      margin-top: 20px;
      border-radius: 4px;
    }
    
    .comment-form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    
    .comment-input-wrapper {
      flex: 1;
      position: relative;
    }
    
    .comment-form textarea {
      min-height: 60px;
      max-height: 60px;
      margin-bottom: 0;
      font-family: inherit;
      width: 100%;
      padding: 12px 15px;
      padding-right: 40px; /* Для счетчика символов */
      border: 1px solid var(--border);
      background: white;
      font-size: 1rem;
      resize: none;
      border-radius: 4px;
      transition: border-color 0.3s;
    }
    
    .comment-form textarea:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(154, 42, 42, 0.1);
    }
    
    .comment-form-buttons {
      display: flex;
      gap: 10px;
    }
    
    .comment-char-count {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 0.8rem;
      color: #999;
      background: white;
      padding: 0 5px;
    }
    
    .comment-char-count.warning {
      color: #f39c12;
    }
    
    .comment-char-count.error {
      color: #e74c3c;
    }
    
    .comment {
      background: rgba(249, 233, 200, 0.5);
      border: 1px solid var(--border);
      padding: 5px;
      margin-bottom: 15px;
      border-radius: 4px;
      position: relative;
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }
    
    .comment-author {
      font-weight: bold;
      color: var(--red-dark);
    }
    
    .comment-admin {
      background: var(--red);
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.8rem;
      margin-left: 10px;
    }
    
    .comment-date {
      color: #666;
      font-size: 0.9rem;
    }
    
    .comment-content {
      line-height: 1.0;
      margin-bottom: 5px;
      white-space: pre-line;
      word-break: break-word;
    }
    
    .comment-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
    
    .comment-delete-btn {
      background: transparent;
      border: 1px solid #dc3545;
      color: #dc3545;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      border-radius: 3px;
      transition: all 0.2s;
    }
    
    .comment-delete-btn:hover {
      background: #dc3545;
      color: white;
    }
    
    .no-comments {
      text-align: center;
      padding: 30px;
      color: #666;
      font-style: italic;
    }
    
    .login-to-comment {
      text-align: center;
      padding: 20px;
      background: rgba(154, 42, 42, 0.05);
      border: 1px dashed var(--red);
      margin-top: 20px;
      border-radius: 4px;
    }
    
    .login-to-comment a {
      color: var(--red);
      font-weight: bold;
      text-decoration: none;
    }
    
    .login-to-comment a:hover {
      text-decoration: underline;
    }
    
    /* Новый стиль для кнопки "Ответить" */
    .reply-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #666;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      border-radius: 3px;
      margin-left: 10px;
      transition: all 0.2s;
    }
    
    .reply-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }
    
    /* Индикатор загрузки */
    .comment-loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(154, 42, 42, 0.3);
      border-radius: 50%;
      border-top-color: var(--red);
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="header-banner">
    Socialist Republic
  </div>

<nav>
 
  <div class="nav-center">
    <a href="index.html">Главная</a>
    <a href="about.html">Об игре</a>
    <a href="screenshots.html">Скриншоты</a>
    <a href="devlog.html">Разработка</a>
    <a href="blog.html">Блог</a>
    <a href="contact.html">Контакты</a>
  </div>
  
<div class="nav-right">
    <div class="auth-buttons">
        <!-- Контент будет подгружен через JavaScript -->
        <script>
            // Временное содержимое, пока не загрузится скрипт
            document.write(`
                <a href="login.html" class="nav-auth">Вход</a>
                <a href="login.html#register" class="nav-auth">Регистрация</a>
            `);
        </script>
    </div>
</div>
</nav>

  <main>
    <h1>Блог разработки</h1>
    <p>Новости и мысли о разработке игры Socialist Republic.</p>
    
    <!-- Кнопка для админа (будет показана только админам) -->
    <div id="create-post-section" class="create-post-btn" style="display: none;">
      <button class="btn-blog" onclick="showPostForm()">✏️ Написать новый пост</button>
    </div>
    
    <!-- Форма создания поста (только для админа) -->
    <div id="post-form" class="post-form">
      <h2>Создать новый пост</h2>
      <form id="create-post-form">
        <div class="form-group">
          <label for="post-title">Заголовок:</label>
          <input type="text" id="post-title" required>
        </div>
        <div class="form-group">
          <label for="post-content">Содержание:</label>
          <textarea id="post-content" required></textarea>
        </div>
        <button type="submit" class="btn-blog">Опубликовать</button>
        <button type="button" class="btn-blog" onclick="hidePostForm()">Отмена</button>
      </form>
    </div>
    
    <div id="message" class="message"></div>
    
    <div id="posts-container">
      <!-- Посты будут загружены через JavaScript -->
      <p style="text-align: center;">Загружаем записи блога...</p>
    </div>
  </main>

  <footer>
    © 2026 Socialist Republic Team
  </footer>

  <script>
    const API_URL = '/api';
    let currentUser = null;
    let isAdmin = false;
    let currentPostComments = {};
    
    function updateAuthUI() {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');
      const authButtons = document.querySelector('.auth-buttons');
      
      if (!authButtons) return;
      
      authButtons.innerHTML = '';
      
      if (token && userStr) {
        currentUser = JSON.parse(userStr);
        isAdmin = currentUser.role === 'admin';
        
        authButtons.innerHTML = `
          <div class="user-info">
            <span class="username">${escapeHtml(currentUser.username)}</span>
            <span class="user-role">${escapeHtml(currentUser.role)}</span>
          </div>
          <a href="#" class="nav-auth nav-logout" onclick="logout()">Выйти</a>
        `;
        
        if (isAdmin) {
          document.getElementById('create-post-section').style.display = 'block';
        }
      } else {
        authButtons.innerHTML = `
          <a href="login.html" class="nav-auth">Вход</a>
          <a href="login.html#register" class="nav-auth">Регистрация</a>
        `;
        currentUser = null;
        isAdmin = false;
      }
    }
    
    async function loadPosts() {
      try {
        const response = await fetch(`${API_URL}/posts`);
        const posts = await response.json();
        
        const container = document.getElementById('posts-container');
        if (posts.length === 0) {
          container.innerHTML = '<p style="text-align: center;">Пока нет записей в блоге. Будьте первым, кто напишет!</p>';
          return;
        }
        
        let html = '';
        for (const post of posts) {
          await loadCommentsForPost(post.id);
          
          html += `
            <div class="post" id="post-${post.id}">
              <h2>${escapeHtml(post.title)}</h2>
              <div class="post-meta">
                👤 ${escapeHtml(post.author)} | 📅 ${new Date(post.created_at).toLocaleDateString('ru-RU')}
              </div>
              <div class="post-content">${formatContent(post.content)}</div>
              
              ${isAdmin ? `
                <div class="admin-controls">
                  <button class="btn-blog" onclick="editPost(${post.id})">Редактировать</button>
                  <button class="btn-blog" onclick="deletePost(${post.id})" style="background: #9a2a2a;">Удалить</button>
                </div>
              ` : ''}
              
              <!-- Секция комментариев будет добавлена после загрузки -->
            </div>
          `;
        }
        
        container.innerHTML = html;
        
        if (isAdmin) {
          document.querySelectorAll('.admin-controls').forEach(btn => {
            btn.style.display = 'block';
          });
        }
        
        for (const post of posts) {
          renderCommentsForPost(post.id);
        }
        
      } catch (error) {
        console.error('Ошибка загрузки постов:', error);
        document.getElementById('posts-container').innerHTML = 
          '<p style="text-align: center; color: #9a2a2a;">Не удалось загрузить записи. Убедитесь, что сервер запущен.</p>';
      }
    }
    
    async function loadCommentsForPost(postId) {
      try {
        const response = await fetch(`${API_URL}/posts/${postId}/comments`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const comments = await response.json();
        currentPostComments[postId] = comments;
      } catch (error) {
        console.error(`Ошибка загрузки комментариев для поста ${postId}:`, error);
        currentPostComments[postId] = [];
      }
    }
    
    function renderCommentsForPost(postId) {
      const postElement = document.getElementById(`post-${postId}`);
      if (!postElement) return;
      
      const comments = currentPostComments[postId] || [];
      
      // Удаляем старую секцию комментариев, если она существует
      const oldSection = postElement.querySelector('.comments-section');
      if (oldSection) {
        oldSection.remove();
      }
      
      let commentsHTML = `
        <div class="comments-section" id="comments-section-${postId}">
          <div class="comments-header">
            <h3>Комментарии</h3>
            <span class="comments-count">${comments.length}</span>
          </div>
      `;
      
      // Список комментариев
      if (comments.length === 0) {
        commentsHTML += `<div class="no-comments">Пока нет комментариев. Будьте первым!</div>`;
      } else {
        commentsHTML += `<div class="comments-list">`;
        comments.forEach(comment => {
          const canDelete = currentUser && (currentUser.id === comment.user_id || currentUser.role === 'admin');
          commentsHTML += `
            <div class="comment" id="comment-${comment.id}">
              <div class="comment-header">
                <div>
                  <span class="comment-author">${escapeHtml(comment.username)}</span>
                  ${comment.role === 'admin' ? '<span class="comment-admin">👑 Админ</span>' : ''}
                </div>
                <div class="comment-date">
                  ${new Date(comment.created_at).toLocaleString('ru-RU')}
                </div>
              </div>
              <div class="comment-content">
                ${formatContent(comment.content)}
              </div>
              ${canDelete ? `
                <div class="comment-actions">
                  <button class="comment-delete-btn" onclick="deleteComment(${comment.id}, ${postId})">
                    Удалить
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        });
        commentsHTML += `</div>`;
      }
      
      // Форма для комментариев (после списка комментариев)
      if (currentUser) {
        commentsHTML += `
          <div class="comment-form">
            <div class="comment-form-row">
              <div class="comment-input-wrapper">
                <textarea 
                  id="comment-text-${postId}" 
                  placeholder="Напишите ваш комментарий..." 
                  maxlength="1000"
                  rows="1"></textarea>
                <div id="char-count-${postId}" class="comment-char-count">0/1000</div>
              </div>
              <div class="comment-form-buttons">
                <button type="button" class="btn-blog" id="submit-comment-${postId}" onclick="addComment(${postId})">
                  Отправить
                </button>
              </div>
            </div>
          </div>
        `;
      } else {
        commentsHTML += `
          <div class="login-to-comment">
            <p>Чтобы оставить комментарий, <a href="login.html">войдите в систему</a>.</p>
          </div>
        `;
      }
      
      commentsHTML += `</div>`;
      
      postElement.innerHTML += commentsHTML;
      
      // Инициализация счетчика символов
      const textarea = document.getElementById(`comment-text-${postId}`);
      if (textarea) {
        const charCount = document.getElementById(`char-count-${postId}`);
        
        // Автоматическое изменение высоты textarea
        textarea.addEventListener('input', function() {
          // Обновление счетчика символов
          const length = this.value.length;
          charCount.textContent = `${length}/1000`;
          
          if (length > 900) {
            charCount.className = 'comment-char-count warning';
          } else if (length > 990) {
            charCount.className = 'comment-char-count error';
          } else {
            charCount.className = 'comment-char-count';
          }
          
          // Автоматическое изменение высоты
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        // Обработка нажатия Enter для отправки
        textarea.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            addComment(postId);
          }
        });
      }
    }
    
    async function addComment(postId) {
      if (!currentUser) {
        showMessage('Для добавления комментария необходимо войти в систему', 'error');
        window.location.href = 'login.html';
        return;
      }
      
      const textarea = document.getElementById(`comment-text-${postId}`);
      const submitBtn = document.getElementById(`submit-comment-${postId}`);
      const content = textarea.value.trim();
      
      if (!content) {
        showMessage('Введите текст комментария', 'error');
        textarea.focus();
        return;
      }
      
      if (content.length < 3) {
        showMessage('Комментарий слишком короткий', 'error');
        textarea.focus();
        return;
      }
      
      const token = localStorage.getItem('token');
      
      try {
        // Показываем индикатор загрузки
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="comment-loading"></span>';
        submitBtn.disabled = true;
        
        const response = await fetch(`${API_URL}/posts/${postId}/comments`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ content })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('Комментарий добавлен', 'success');
          textarea.value = '';
          textarea.style.height = 'auto';
          
          // Сбрасываем счетчик символов
          const charCount = document.getElementById(`char-count-${postId}`);
          if (charCount) {
            charCount.textContent = '0/1000';
            charCount.className = 'comment-char-count';
          }
          
          // Добавляем новый комментарий в список
          if (!currentPostComments[postId]) {
            currentPostComments[postId] = [];
          }
          currentPostComments[postId].push(data.comment);
          
          // Перерисовываем комментарии (обновляем без перезагрузки страницы)
          renderCommentsForPost(postId);
        } else {
          showMessage(data.error, 'error');
        }
      } catch (error) {
        showMessage('Ошибка сети', 'error');
      } finally {
        // Восстанавливаем кнопку
        if (submitBtn) {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      }
    }
    
    async function deleteComment(commentId, postId) {
      if (!confirm('Удалить этот комментарий?')) return;
      
      const token = localStorage.getItem('token');
      
      try {
        const response = await fetch(`${API_URL}/comments/${commentId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (response.ok) {
          showMessage('Комментарий удалён', 'success');
          
          // Удаляем комментарий из списка
          if (currentPostComments[postId]) {
            currentPostComments[postId] = currentPostComments[postId].filter(
              comment => comment.id !== commentId
            );
            
            // Перерисовываем комментарии
            renderCommentsForPost(postId);
          }
        } else {
          const data = await response.json();
          showMessage(data.error, 'error');
        }
      } catch (error) {
        showMessage('Ошибка сети', 'error');
      }
    }
    
    function formatContent(text) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function showPostForm() {
      if (!isAdmin) {
        showMessage('Только администраторы могут создавать посты', 'error');
        return;
      }
      document.getElementById('post-form').style.display = 'block';
      document.getElementById('post-title').focus();
    }
    
    function hidePostForm() {
      document.getElementById('post-form').style.display = 'none';
      document.getElementById('create-post-form').reset();
    }
    
    document.getElementById('create-post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const token = localStorage.getItem('token');
      if (!token) {
        showMessage('Требуется авторизация', 'error');
        return;
      }
      
      const title = document.getElementById('post-title').value;
      const content = document.getElementById('post-content').value;
      
      if (!title.trim() || !content.trim()) {
        showMessage('Заполните все поля', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/posts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, content })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('Пост опубликован!', 'success');
          hidePostForm();
          loadPosts();
        } else {
          showMessage(data.error, 'error');
        }
      } catch (error) {
        showMessage('Ошибка сети', 'error');
      }
    });
    
    async function editPost(id) {
      try {
        const response = await fetch(`${API_URL}/posts/${id}`);
        const post = await response.json();
        
        const newTitle = prompt('Новый заголовок:', post.title);
        if (!newTitle) return;
        
        const newContent = prompt('Новое содержание:', post.content);
        if (!newContent) return;
        
        const token = localStorage.getItem('token');
        
        const updateResponse = await fetch(`${API_URL}/posts/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title: newTitle, content: newContent })
        });
        
        if (updateResponse.ok) {
          showMessage('Пост обновлён!', 'success');
          loadPosts();
        } else {
          const data = await updateResponse.json();
          showMessage(data.error, 'error');
        }
      } catch (error) {
        showMessage('Ошибка сети', 'error');
      }
    }
    
    async function deletePost(id) {
      if (!confirm('Удалить этот пост?')) return;
      
      const token = localStorage.getItem('token');
      
      try {
        const response = await fetch(`${API_URL}/posts/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (response.ok) {
          showMessage('Пост удалён!', 'success');
          loadPosts();
        } else {
          const data = await response.json();
          showMessage(data.error, 'error');
        }
      } catch (error) {
        showMessage('Ошибка сети', 'error');
      }
    }
    
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      updateAuthUI();
      location.reload();
    }
    
    function showMessage(text, type = 'success') {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 3000);
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      updateAuthUI();
      await loadPosts();
    });
  </script>
</body>
</html>
